; ============================================================
; SigDash - build for Waveshare ESP32-S3-Touch-LCD-4.3B (N16R8)
;
; "Hybrid compile" of pioarduino: the Arduino core libraries are
; rebuilt with the settings below. The important part is running
; the program from PSRAM (XIP) - then writes to flash (Wi-Fi, NVS,
; history) no longer stop the display = no glitches / shifting.
; Based on the pioarduino example env "esp32s3-qio_opi_per"
; ("OPI Performance settings -> Display use").
; ============================================================

[platformio]
default_envs = sigdash
src_dir = src

[env:sigdash]
; pioarduino 55.03.39 = Arduino-ESP32 3.3.9 / ESP-IDF 5.5.4
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
; 16 MB flash (QIO), 8 MB OPI PSRAM
board = esp32s3_120_16_8-qio_opi
board_build.partitions = app3M_fat9M_16MB.csv
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I src
    '-DSIGDASH_BUILD="XIP"'

lib_deps =
    ; ESP32_Display_Panel v1.0.5 (no release tag, exact commit)
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#92b790ed6d24b0678e2f45b1fc85f0abd2d41b33
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.3.0
    https://github.com/lvgl/lvgl.git#v9.6.0

lib_ignore =
    ble
    dsp
    spiffs
    Matter
    Zigbee
    ESP RainMaker

; --- the actual fix: code + constants in PSRAM, IRAM-safe LCD interrupt ---
custom_sdkconfig =
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
    CONFIG_GDMA_ISR_IRAM_SAFE=y
    CONFIG_I2S_ISR_IRAM_SAFE=y
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
    CONFIG_SPIRAM_RODATA=y
    CONFIG_ESP32S3_DATA_CACHE_64KB=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y

; components SigDash does not use (shorter build, as in the pioarduino example)
custom_component_remove =
    espressif/esp_hosted
    espressif/esp_wifi_remote
    espressif/network_provisioning
    espressif/mdns
    espressif/esp-dsp
    espressif/esp_modem
    espressif/esp32-camera
    espressif/libsodium
    espressif/esp-modbus
    espressif/qrcode
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/cbor
    espressif/esp_rainmaker
    espressif/rmaker_common
    chmorgan/esp-libhelix-mp3
